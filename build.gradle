plugins {
    id 'java-library'
    id 'jvm-test-suite'
    id 'maven-publish'
    alias(libs.plugins.spotless)
    alias(libs.plugins.owasp.dependencycheck)
    alias(libs.plugins.versions)
    alias(libs.plugins.openrewrite)
}

group = 'com.maybeitssquid'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

testing {
    suites.test {
        useJUnitJupiter(libs.versions.junit)
    }
}

spotless {
    java {
        googleJavaFormat()
        removeUnusedImports()
    }
}

rewrite {
    activeRecipe(
        'org.openrewrite.java.migrate.UpgradeToJava21',
        'org.openrewrite.staticanalysis.CommonStaticAnalysis',
        'org.openrewrite.java.testing.junit5.JUnit5BestPractices'
    )
}

dependencies {
    rewrite(platform("org.openrewrite.recipe:rewrite-recipe-bom:${libs.versions.rewrite.recipe.bom.get()}"))
    rewrite('org.openrewrite.recipe:rewrite-migrate-java')
    rewrite('org.openrewrite.recipe:rewrite-static-analysis')
    rewrite('org.openrewrite.recipe:rewrite-testing-frameworks')
}

tasks.named('dependencyUpdates').configure {
    gradleReleaseChannel = 'current'
    rejectVersionIf {
        candidate.version.contains('-alpha') ||
            candidate.version.contains('-beta') ||
            candidate.version.contains('-rc')
    }
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(Javadoc).configureEach {
    options {
        encoding = 'UTF-8'
        links 'https://docs.oracle.com/en/java/javase/21/docs/api/'
        addBooleanOption('html5', true)
    }
}

publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/${System.env.GITHUB_REPOSITORY ?: 'bhanafee/ACHCharset'}")
            credentials {
                username = System.env.USERNAME ?: System.env.GITHUB_ACTOR
                password = System.env.TOKEN ?: System.env.GITHUB_TOKEN
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'ACHCharset'
                description = 'Java Charset implementation for ACH transliterating ASCII encoding'
                url = 'https://github.com/bhanafee/ACHCharset'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                scm {
                    url = 'https://github.com/bhanafee/ACHCharset'
                    connection = 'scm:git:git://github.com/bhanafee/ACHCharset.git'
                    developerConnection = 'scm:git:ssh://github.com/bhanafee/ACHCharset.git'
                }
            }
        }
    }
}
