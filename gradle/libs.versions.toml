[versions]
# Java toolchain
java = "21"

# Plugin versions
spotless = "8.+"
owasp-dependencycheck = "12.+"

# Testing
junit = { strictly = "[5,)", prefer = "5.12.+" }

[libraries]
# Security patches — open-range floor constraints for vulnerable transitive dependencies
patch-ghsa-72hv-8253-57qq = { module = "com.fasterxml.jackson.core:jackson-core", version = { strictly = "[2.21.1,)", prefer = "2.21.1" } }

[bundles]
security-patches = ["patch-ghsa-72hv-8253-57qq"]

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
owasp-dependencycheck = { id = "org.owasp.dependencycheck", version.ref = "owasp-dependencycheck" }
