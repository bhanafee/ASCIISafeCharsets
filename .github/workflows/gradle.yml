name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        java-version: [ '17', '21' ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java-${{ matrix.java-version }}
          path: build/reports/tests/test/

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        id: publish
        continue-on-error: true
        run: ./gradlew publish --info --stacktrace
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Diagnose 422 with curl
        if: steps.publish.outcome == 'failure'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          JAR=$(ls build/libs/ACHCharset-*.jar | grep -v sources | grep -v javadoc | head -1)
          echo "Uploading $JAR"
          VERSION=$(basename "$JAR" .jar | sed 's/^ACHCharset-//')
          URL="https://maven.pkg.github.com/${GITHUB_REPOSITORY}/io/github/bhanafee/ACHCharset/${VERSION}/ACHCharset-${VERSION}.jar"
          echo "PUT $URL"
          curl -v -X PUT \
            -u "bhanafee:${TOKEN}" \
            -H "Content-Type: application/java-archive" \
            --data-binary "@${JAR}" \
            "$URL"
          echo "exit=$?"
          exit 1

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v4
